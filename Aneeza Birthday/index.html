<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="intro-label">Our journey</div>

<div class="road-container" id="roadContainer">
  <svg class="road-svg" id="roadSvg" preserveAspectRatio="none">
    <path id="roadPath" fill="none" stroke="#9F6162" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" vector-effect="non-scaling-stroke"></path>
  </svg>
  <div id="nodesLayer"></div>
  <div id="stopsLayer"></div>
</div>

<div id="lettersLayer"></div>

<div class="final-screen" id="finalScreen">
  <div id="particlesLayer"></div>
  <div class="final-label">for aneeza</div>
  <p class="final-message">Happy Birthday, Aneeza.<br><br>You are to me what the right translation is to a sentence that spent years meaning something else in everyone else's mouth.<br><br>I love you.</p>
</div>

<div class="cursor-dot" id="cursorDot"></div>

<script src="script.js"></script>
</body>
</html>
